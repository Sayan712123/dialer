name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and copy our code in
        run: |
          flutter create --org com.example --project-name contacts_dialer --platforms=android app
          cp pubspec.yaml app/pubspec.yaml
          cp main.dart app/lib/main.dart
      - name: Add permissions to the manifest
        run: |
          python3 - <<'PY'
          p = 'app/android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = '''<uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.WRITE_CONTACTS"/>
              <uses-permission android:name="android.permission.READ_CALL_LOG"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              '''
          intents = '''<queries>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="sms"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="mailto"/></intent>'''
          assert '<application' in s and '<queries>' in s
          s = s.replace('<application', perms + '<application', 1)
          s = s.replace('<queries>', intents, 1)
          open(p, 'w').write(s)
          PY
      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: contacts-dialer-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

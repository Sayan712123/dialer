name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and copy our code in
        run: |
          flutter create --org com.example --project-name contacts_dialer --platforms=android app
          cp pubspec.yaml app/pubspec.yaml
          cp main.dart app/lib/main.dart
          K=app/android/app/src/main/kotlin/com/example/contacts_d

name: contacts_dialer
description: Flutter recreation of the Contacts and dialer UI (Recents, Contacts, Keypad).
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_contacts: ^1.1.9+2
  call_log: ^5.0.3
  permission_handler: ^11.3.1
  flutter_phone_direct_caller: ^2.1.1
  url_launcher: ^6.3.0
flutter:
  uses-material-design: true
